<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#fffaf3;font-family:Arial,Helvetica,sans-serif;color:#1c1917">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;padding:32px;border:1px solid #e7e5e4">
            <tr>
              <td style="font-size:22px;font-weight:800;color:#ea580c">🐾 Huellitas</td>
            </tr>
            <tr>
              <td style="padding-top:20px;font-size:20px;font-weight:800">Confirma tu nuevo correo</td>
            </tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#44403c">Pediste cambiar el correo de tu cuenta de Huellitas a {{ .NewEmail }}. Confírmalo con el botón.</td>
            </tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/perfil" style="display:inline-block;background:#ea580c;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:12px">Confirmar cambio</a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;line-height:1.6;color:#78716c">
                Si no fuiste tú, cambia tu contraseña de inmediato.<br /><br />
                Huellitas nunca te pedirá tu contraseña, datos bancarios ni códigos por correo o mensaje.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
